<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burrow</title>
  </head>
  <body>
    <!-- Splash until App.vue has its workspaces (src/lib/splash.ts removes it). -->
    <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0d0d0d;transition:opacity .35s ease">
      <img src="/icons/icon-512.png" alt="" width="128" height="128" style="border-radius:28px;animation:splash-in .6s ease-out both" />
      <div style="font:600 20px -apple-system,BlinkMacSystemFont,sans-serif;color:#f5a524;letter-spacing:.02em;animation:splash-in .6s .1s ease-out both">Burrow</div>
    </div>
    <style>@keyframes splash-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}</style>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
