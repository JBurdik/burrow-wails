name: Burrow
options:
  bundleIdPrefix: com.agenticide.burrow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9QY36KZ8JP
    # release.sh builds unsigned and codesigns with the team wildcard profile
    # (no Xcode account needed, same as src-ios). No App Groups therefore.
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.4.4"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Burrow:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenticide.burrow.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Burrow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [burrow]
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/Burrow.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.agenticide.burrow.shared]
        # APNs (Push.swift). Needs the explicit App ID's profile, see release.sh.
        aps-environment: development
    dependencies:
      - target: BurrowWidgets
      - target: BurrowShare
  BurrowWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenticide.burrow.ios.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Burrow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.agenticide.burrow.shared]
  BurrowShare:
    type: app-extension
    platform: iOS
    sources: [Share, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenticide.burrow.ios.share
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Burrow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Share/Share.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.agenticide.burrow.shared]
